<title>Mohit Portfolio</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Arial,sans-serif;
background:#111;
color:white;
text-align:center;
overflow-x:hidden;
}

.hero{
min-height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
padding:40px 20px;
background:linear-gradient(135deg,#000,#333);
animation:fadeIn 1.5s ease;
}

.profile{
width:180px;
height:180px;
border-radius:50%;
object-fit:cover;
border:4px solid gold;
box-shadow:0 0 25px gold;
margin-bottom:20px;
transition:.4s;
}

.profile:hover{
transform:scale(1.05);
}

h1{
font-size:48px;
margin-bottom:10px;
}

.tagline{
font-size:20px;
color:gold;
margin-bottom:15px;
}

p{
font-size:18px;
color:#ddd;
margin-bottom:15px;
}

button{
padding:14px 30px;
border:none;
border-radius:30px;
background:gold;
color:#000;
font-size:18px;
font-weight:bold;
cursor:pointer;
margin:10px;
transition:.3s;
}

button:hover{
transform:scale(1.05);
box-shadow:0 0 20px gold;
}

.section{
padding:60px 20px;
}

.card{
background:#222;
padding:20px;
margin:15px auto;
max-width:500px;
border-radius:15px;
}

footer{
padding:25px;
background:#000;
color:#aaa;
}

@keyframes fadeIn{
from{
opacity:0;
transform:translateY(30px);
}
to{
opacity:1;
transform:translateY(0);
}
}

@media(max-width:768px){

.profile{
width:140px;
height:140px;
}

h1{
font-size:34px;
}

.tagline{
font-size:16px;
}

p{
font-size:16px;
}

button{
width:90%;
max-width:320px;
}

.section{
padding:40px 15px;
}

}

</style>

</head>
